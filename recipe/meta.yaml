{% set name = "pywbt" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pywbt-{{ version }}.tar.gz
  sha256: 4b84dccd24cd5fda7d7812421cdb42ffd5ba9f38cfd013f31ff60d843be03cc0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatch-vcs
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - filelock
    - tomli >=1.1

test:
  imports:
    - pywbt
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/cheginit/pywbt
  summary: A lightweight Python wrapper for WhiteboxTools command-line interface
  license: MIT
  license_file: LICENSE
  doc_url: https://pywbt.readthedocs.io

extra:
  recipe-maintainers:
    - cheginit
